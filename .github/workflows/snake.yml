# Gera a animação da cobrinha comendo o gráfico de contribuições
name: Gerar cobrinha

on:
  # roda sozinho todo dia à meia-noite (UTC)
  schedule:
    - cron: "0 0 * * *"
  # permite rodar na mão pela aba Actions
  workflow_dispatch:
  # roda também sempre que você atualizar o repositório
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Gerar a cobrinha (versões clara e escura)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Publicar as imagens no branch "output"
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
